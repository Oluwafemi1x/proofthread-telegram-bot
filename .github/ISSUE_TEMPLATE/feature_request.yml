name: Feature request
description: Propose an improvement with a clear user problem
title: "feat: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what cannot they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behaviour, without prescribing an implementation if possible.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and trust impact
      description: Does this collect more data, automate judgment, or change permissions?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

